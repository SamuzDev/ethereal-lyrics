[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ethereal-lyrics"
version = "0.5.27"
description = "Display synced Spotify lyrics in your terminal with an aesthetic UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ethereal-lyrics" }
]
dependencies = [
    "spotipy>=2.24.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "dbus-python>=1.2.0; sys_platform == 'linux'",
]

[project.scripts]
ethereal-lyrics = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
